---
stages:
  - test
  - build
  - deploy

shellcheck:
  stage: test
  tags:
    - gitlab-org-docker
  image: alpine:latest
  before_script:
    - apk update
    - apk add --no-cache shellcheck
  script:
    - echo "Revisando scripts..."
    - shellcheck --version
    - shellcheck --shell=sh --severity=warning DEBIAN/*
    - shellcheck --shell=bash --severity=warning etc/cron.daily/*
    - shellcheck --shell=bash --severity=warning etc/cron.monthly/*
    - shellcheck --shell=bash --severity=warning usr/lib/nagios/plugins/check_backup-cron
    - shellcheck --shell=bash --severity=warning usr/libexec/backup-cron/backup-cron_functions.sh
    - shellcheck --shell=bash --severity=warning usr/sbin/*
    - echo "No se encontraron problemas en scripts."
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - DEBIAN/**/*
        - etc/**/*
        - usr/**/*

build_deb_pkg:
  stage: build
  tags:
    - gitlab-org-docker
  image: debian:stable-slim
  before_script:
    - apt-get update && apt-get install -y dpkg
  script:
    - |
      mkdir -p ${CI_PROJECT_NAME}/DEBIAN

      cp -r DEBIAN/ ${CI_PROJECT_NAME}
      find ${CI_PROJECT_NAME}/DEBIAN -type f -exec chmod 644 {} +
      if [ -f ${CI_PROJECT_NAME}/DEBIAN/preinst ]; then chmod 755 ${CI_PROJECT_NAME}/DEBIAN/preinst; fi
      if [ -f ${CI_PROJECT_NAME}/DEBIAN/postinst ]; then chmod 755 ${CI_PROJECT_NAME}/DEBIAN/postinst; fi
      if [ -f ${CI_PROJECT_NAME}/DEBIAN/prerm ]; then chmod 755 ${CI_PROJECT_NAME}/DEBIAN/prerm; fi
      if [ -f ${CI_PROJECT_NAME}/DEBIAN/postrm ]; then chmod 755 ${CI_PROJECT_NAME}/DEBIAN/postrm; fi

      cp -r etc/ ${CI_PROJECT_NAME}
      chmod 755 ${CI_PROJECT_NAME}/etc/cron.daily/*
      chmod 755 ${CI_PROJECT_NAME}/etc/cron.monthly/*

      cp -r usr/ ${CI_PROJECT_NAME}
      chmod 755 ${CI_PROJECT_NAME}/usr/lib/nagios/plugins/*
      chmod 755 ${CI_PROJECT_NAME}/usr/libexec/backup-cron/*
      chmod 755 ${CI_PROJECT_NAME}/usr/sbin/*

      cat <<EOF > ${CI_PROJECT_NAME}/DEBIAN/control
      Package: ${CI_PROJECT_NAME}
      Version: ${CI_COMMIT_TAG#v}
      Section: admin
      Priority: optional
      Architecture: all
      Depends: bzip2, mailutils, mbuffer, monitoring-plugins, pv, rsync, tar, tmpreaper
      Maintainer: Martin Andres Gomez Gimenez <mggimenez@nis.com.ar>
      Description: A minimalist backup copy generation system.
      EOF

      dpkg-deb --build ${CI_PROJECT_NAME} ${CI_PROJECT_NAME}-${CI_COMMIT_TAG#v}.deb
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    paths:
      - "*.deb"
    expire_in: never

publish_deb_pkg:
  stage: deploy
  tags:
    - gitlab-org-docker
  image: curlimages/curl:latest
  needs:
    - job: build_deb_pkg
      artifacts: true
  script:
    - |
      curl --request PUT \
           --user "gitlab-ci-token:${CI_JOB_TOKEN}" \
           --upload-file "${CI_PROJECT_NAME}-${CI_COMMIT_TAG#v}.deb" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/debian/${CI_PROJECT_NAME}-${CI_COMMIT_TAG#v}.deb?distribution=stable&component=main"
  rules:
    - if: $CI_COMMIT_TAG
